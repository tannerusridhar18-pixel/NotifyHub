spring:
  config:
    import: optional:file:./application-local.yml
  profiles:
    active: local
  application:
    name: notifyhub-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/notifyhub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

notifyhub:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  jwt-secret: ${JWT_SECRET:}
  jwt-access-minutes: ${JWT_ACCESS_MINUTES:15}
  jwt-refresh-days: ${JWT_REFRESH_DAYS:7}
  password-reset-minutes: ${PASSWORD_RESET_MINUTES:30}
  invitation-hours: ${INVITATION_HOURS:48}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  admin-username: ${ADMIN_USERNAME:admin}
  admin-email: ${ADMIN_EMAIL:admin@notifyhub.local}
  admin-password: ${ADMIN_PASSWORD:}
  admin-sync-password: ${ADMIN_SYNC_PASSWORD:false}
  rate-limit-public-per-minute: ${RATE_LIMIT_PUBLIC_PER_MINUTE:120}
  rate-limit-auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
  rate-limit-query-per-minute: ${RATE_LIMIT_QUERY_PER_MINUTE:10}

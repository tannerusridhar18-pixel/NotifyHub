# Loaded only with SPRING_PROFILES_ACTIVE=prod (see ProductionSafetyCheck for the startup checks).
notifyhub:
  # No default on purpose: the application will not start unless JWT_SECRET is provided.
  jwt-secret: ${JWT_SECRET}
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:None}

spring:
  datasource:
    # No development defaults in production.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: NotifyHubProductionPool
      maximum-pool-size: ${DB_POOL_MAX:25}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}

logging:
  level:
    root: INFO
    org.flywaydb.core.FlywayExecutor: WARN

